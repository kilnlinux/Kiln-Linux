; Kiln Linux polybar config: the twmx bar. Reference: https://github.com/polybar/polybar/wiki
; Started by ~/.xinitrc (polybar kiln). twmx reserves its space as a dock.

[colors]
bg = #@bg@
surface = #@surface@
line = #@line@
fg = #@fg@
muted = #@muted@
accent = #@accent@
urgent = #@urgent@

[bar/kiln]
height = @bar_height@
background = ${colors.bg}
foreground = ${colors.fg}
font-0 = @font_mono@:size=@font_size@;2
padding-right = 2
module-margin-left = 2
separator = " "
separator-foreground = ${colors.line}
modules-left = workspaces title
modules-right = volume network battery date
; Bottom line in the border color separates the bar from windows without a shadow.
border-bottom-size = 1
border-bottom-color = ${colors.line}
cursor-click = pointer

; Workspaces from twmx's _NET_DESKTOP_NAMES. Only occupied ones and the current one.
[module/workspaces]
type = internal/xworkspaces
enable-scroll = false
label-active = %name%
label-active-background = ${colors.accent}
label-active-padding = 1
label-occupied = %name%
label-occupied-padding = 1
label-urgent = %name%
label-urgent-background = ${colors.urgent}
label-urgent-padding = 1
label-empty =

[module/title]
type = internal/xwindow
label = %title:0:80:…%
label-foreground = ${colors.muted}

; PipeWire through pipewire-pulse (the audio profile). Hidden without a sound server.
[module/volume]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume = vol %percentage%%
label-muted = vol muted
label-muted-foreground = ${colors.muted}

[module/network]
type = internal/network
interface-type = wireless
label-connected = %essid%
label-disconnected =

[module/battery]
type = internal/battery
; Hidden on machines without a battery.
full-at = 98
format-charging = <label-charging>
format-discharging = <label-discharging>
label-charging = bat %percentage%%+
label-discharging = bat %percentage%%
label-full = bat full

[module/date]
type = internal/date
interval = 5
date = %a %d %b
time = %H:%M
label = %date%  %time%
