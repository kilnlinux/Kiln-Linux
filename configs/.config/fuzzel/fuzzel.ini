# Kiln Linux fuzzel config. Reference: man 5 fuzzel.ini
[main]
font=@font_sans@:size=11
terminal=foot -e
prompt="▲ "
width=40
lines=10
horizontal-pad=16
vertical-pad=12
inner-pad=8

[colors]
background=@surface@ff
text=@fg@ff
prompt=@accent@ff
input=@fg@ff
placeholder=@muted@ff
match=@fg@ff
selection=@accent@ff
selection-text=@fg@ff
selection-match=@fg@ff
border=@line@ff

[border]
width=@border@
radius=0
